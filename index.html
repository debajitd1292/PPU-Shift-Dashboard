<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shift Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
* { box-sizing: border-box; }

body { margin:0; font-family: Arial; background:#eef1f5; }

/* HEADER */
.header {
  background:#1f3a5f;
  color:white;
  padding:12px;
  text-align:center;
}

.logo {
  width:42px;
  margin-bottom:4px;
  border-radius:6px;
}

.title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 3px;
  letter-spacing: 0.5px;
}

/* DATE */
#date {
  font-size:15px;
  font-weight:bold;
}

.birthday {
  font-size: 13px;
  margin-top: 3px;
  font-weight: bold;
  color: #ff4081;
}

.special-day {
  color:#FFD700;
}

/* BANNER CHIP */
.banner {
  display:inline-block;
  margin-top:6px;
  padding:6px 12px;
  border-radius:20px;
  font-weight:bold;
  font-size:14px;
}

/* COLORS */
.banner.A { background:purple; color:white; }
.banner.B { background:orange; color:white; }
.banner.C { background:blue; color:white; }
.banner.OFF { background:darkgreen; color:white; }
.banner.L { background:#FFD700; color:black; }
.banner.G { background:crimson; color:white; }
.banner.T { background:#00bcd4; color:black; }

.container {
  max-width:600px;
  margin:auto;
  padding:10px;
}

.card {
  background:white;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.controls {
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

select, input, button {
  width:100%;
  margin-top:6px;
  padding:6px;
}

/* CHIPS */
.chip-container {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}

.chip {
  padding:5px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  color:white;
}

/* SHIFT COLORS */
.A { background:purple; }
.B { background:orange; }
.C { background:blue; }
.OFF { background:darkgreen; }
.L { background:#FFD700; color:black; }
.G { background:crimson; }
.T { background:#00bcd4; color:black; }

.me { border:2px solid black; }

}
</style>
</head>

// FILE LOAD
document.getElementById("fileInput").addEventListener("change", handleFile);

function handleFile(e){
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event){
    let today = new Date();
localStorage.setItem("lastUploadMonth", today.getMonth());
checkReminder();
    let base64 = btoa(
      new Uint8Array(event.target.result)
      .reduce((data, byte)=> data + String.fromCharCode(byte), '')
    );

    localStorage.setItem("excelData", base64);
    processExcel(event.target.result);
  };

  reader.readAsArrayBuffer(file);
}

function processExcel(buffer){
  const data = new Uint8Array(buffer);
  const workbook = XLSX.read(data,{type:"array"});
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(sheet,{header:1});
  processData(json);
}

function processData(data){
  originalData = data;
  let today = new Date().getDate();
  renderSection("todaySection","TODAY",data,today);
  populateDropdowns(data);
  updateBanner(data);
  updateNextHoliday();
}

// UTILS
function sortBySeniority(list){
  return list.sort((a,b)=>{
    let iA=seniority.findIndex(x=>x.toLowerCase()===a.name.trim().toLowerCase());
    let iB=seniority.findIndex(x=>x.toLowerCase()===b.name.trim().toLowerCase());
    if(iA===-1) iA=999;
    if(iB===-1) iB=999;
    return iA-iB;
  });
}

function getSaturdayTag(year,month,day){
  let d=new Date(year,month,day);
  if(d.getDay()!==6) return "";
  let w=Math.ceil(day/7);
  if(w===2) return " (2nd Sat)";
  if(w===4) return " (4th Sat)";
  return "";
}

// RENDER
function renderSection(id,title,data,day){
  let A=[],B=[],C=[],G=[],OFF=[],L=[],T=[];
  let multiA=false, multiB=false, multiC=false;

  for(let i=1;i<data.length;i++){
    let name=data[i][0];
    if(!name) continue;

    let shift = overrides[name+"_"+day] ||
      (data[i][day]||"").toString().replace(/\s+/g,'').toUpperCase();

    let obj={name,shift};

    if(shift.includes("A")) A.push(obj);
    if(shift.includes("B")) B.push(obj);
    if(shift.includes("C")) C.push(obj);

    if(shift==="G") G.push(obj);
    else if(shift==="L") L.push(obj);
    else if(shift==="T") T.push(obj);
    else if(shift.includes("R")||shift.includes("O")) OFF.push({name,shift:"OFF"});

    if(shift.length>1){
    if(shift.includes("A")) multiA = true;
    if(shift.includes("B")) multiB = true;
    if(shift.includes("C")) multiC = true;
    }
  }

  A=sortBySeniority(A);
  B=sortBySeniority(B);
  C=sortBySeniority(C);
  G=sortBySeniority(G);
  OFF=sortBySeniority(OFF);
  L=sortBySeniority(L);
  T=sortBySeniority(T);

  let html=`
  <div class="card">
    <h3>${title}</h3>
    ${createList("A SHIFT",A,true,multiA)}
    ${createList("B SHIFT",B,true,multiB)}
    ${createList("C SHIFT",C,true,multiC)}
    ${createList("GENERAL",G)}
    ${createList("REST/OFF",OFF)}
    ${createList("LEAVE",L)}
    ${createList("TOUR/TRAINING",T)}
  </div>`;

  document.getElementById(id).innerHTML=html;
}

// LIST (FIXED COLORS)
function createList(title,list,check=false,multi=false){

  let hazard = (check && list.length<=2) ? " ❗" : "";
  let multiSign = (multi && check) ? " ❕" : "";

  let shiftClass="";
  if(title.includes("A SHIFT")) shiftClass="A";
else if(title.includes("B SHIFT")) shiftClass="B";
else if(title.includes("C SHIFT")) shiftClass="C";
else if(title.includes("GENERAL")) shiftClass="G";
else if(title.includes("REST/OFF")) shiftClass="OFF";
else if(title.includes("LEAVE")) shiftClass="L";
else if(title.includes("TOUR")) shiftClass="T";

  let items=list.map(x=>{
    let h=(x.name===myName)?"me":"";
    return `<span class="chip ${shiftClass} ${h}">${x.name}</span>`;
  }).join("");

  return `<b>${title} (${list.length})${hazard}${multiSign}</b>
  <div class="chip-container">${items||"-"}</div>`;
}

// DROPDOWN
function populateDropdowns(data){
  let p=document.getElementById("personSelect");
  let m=document.getElementById("myName");

  p.innerHTML=""; m.innerHTML="";

  for(let i=1;i<data.length;i++){
    let name=data[i][0];
    if(!name) continue;
    p.add(new Option(name,name));
    m.add(new Option(name,name));
  }

  m.value=myName;

  m.onchange=function(){
    myName=this.value;
    localStorage.setItem("myName",myName);
    processData(originalData);
  };
}

// OVERRIDE
function applyOverride(){
  let name=document.getElementById("personSelect").value;
  let shift=document.getElementById("shiftSelect").value;
  let day=new Date().getDate();

  overrides[name+"_"+day]=shift;
  localStorage.setItem("overrides",JSON.stringify(overrides));
  processData(originalData);
}

// DATE PICKER
function loadSelectedDate(){
  let selected=document.getElementById("datePicker").value;
  if(!selected) return;
  let day=new Date(selected).getDate();
  renderSection("selectedSection","SELECTED ("+selected+")",originalData,day);
}

// BANNER
function updateBanner(data){
  if(!myName) return;

  let today=new Date().getDate();
  let shift="";

  for(let i=1;i<data.length;i++){
    if(data[i][0]===myName){
      shift = overrides[myName+"_"+today] ||
        (data[i][today]||"").toString().replace(/\s+/g,'').toUpperCase();

      if(shift.includes("R")||shift.includes("O")) shift="OFF";
      break;
    }
  }

  let b=document.getElementById("banner");
  b.className="banner "+shift;
  b.innerText="Today Shift: "+shift;
}

// NEXT HOLIDAY
function getNextHoliday(type){
  let today=new Date();
  let result=null;

  for(let key in holidays){
    if(holidays[key]===type){
      let d=new Date(key);
      if(d>=today){
        if(!result||d<result) result=d;
      }
    }
  }

  if(!result) return "-";
  return result.getDate()+" "+result.toLocaleString('default',{month:'short'});
}

function updateNextHoliday(){
  document.getElementById("nextHoliday").innerText =
  "Next GH: "+getNextHoliday("GH")+" | Next RH: "+getNextHoliday("RH");
}

// AUTO LOAD
window.onload=function(){
checkReminder();
  let saved=localStorage.getItem("excelData");
  if(saved){
    let binary=atob(saved);
    let buffer=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++){
      buffer[i]=binary.charCodeAt(i);
    }
    processExcel(buffer.buffer);
  }
};
